name: 'LeakGuard AST Analyzer'
description: 'Statically analyzes Python code for unclosed resources.'
inputs:
  target_directory:
    description: 'The directory to scan for Python files.'
    required: true
    default: '.'
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.target_directory }}